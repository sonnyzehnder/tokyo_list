f.forEach(e=>{const k=e.querySelector("b").textContent,a=document.createElement("a");a.className="l";a.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(k+" Tokyo");a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open in Google Maps ↗";e.querySelector("figcaption").append(a)});
let cat="",key="i";
function draw(){f.forEach(e=>e.hidden=!!cat&&e.dataset.c!==cat);
[...f].sort((a,b)=>key==="r"?b.dataset.r-a.dataset.r:a.dataset.i-b.dataset.i).forEach(e=>g.appendChild(e))}
document.querySelectorAll("#cats button").forEach(x=>x.onclick=()=>{document.querySelectorAll("#cats button").forEach(y=>y.classList.toggle("on",y===x));cat=x.dataset.f;draw()});
document.querySelectorAll("#sort button").forEach(x=>x.onclick=()=>{document.querySelectorAll("#sort button").forEach(y=>y.classList.toggle("on",y===x));key=x.dataset.s;draw()});
</script>
